<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo „Wolkenatlas“ (Nov. 2026): Ein Gleitschirmflieger, dessen Schirm
       eine Quellwolke ist. Der Witz: oben sieht man nur Wolke, erst die
       gewölbte Unterkante, die Leinen und der kleine Pilot machen daraus
       einen Schirm. Farben wie die App: Hintergrund = Tinte (Farbe „ink“ der Seite),
       Pilot in einem hellen Pink, verwandt mit der Farbe „start“.
       Aus dieser Datei sind alle Symbole in icons/ und apple-touch-icon.png
       gerechnet. Wer das Logo ändert, muss die PNG-Dateien neu erzeugen. -->
  <rect width="512" height="512" fill="#15202B"/>
  <defs>
    <!-- Die Wolke endet unten in einem flachen Bogen, wie die Kappe eines
         Schirms von vorn: in der Mitte höher, an den Enden tiefer. -->
    <clipPath id="ueber">
      <path d="M0 0 H512 V300 L420 300 L420 258 Q256 210 92 258 L92 300 L0 300 Z"/>
    </clipPath>
  </defs>
  <g fill="#FFFFFF" clip-path="url(#ueber)">
    <circle cx="158" cy="226" r="48"/>
    <circle cx="218" cy="186" r="62"/>
    <circle cx="294" cy="168" r="72"/>
    <circle cx="362" cy="216" r="52"/>
    <path d="M92 258 Q92 222 128 222 L384 222 Q420 222 420 258 Z"/>
  </g>
  <!-- Leinen: je drei pro Seite, laufen an den beiden Karabinern zusammen -->
  <g stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity=".7" fill="none">
    <path d="M100 254 L250 372"/><path d="M162 239 L250 372"/><path d="M220 231 L250 372"/>
    <path d="M412 254 L262 372"/><path d="M350 239 L262 372"/><path d="M292 231 L262 372"/>
  </g>
  <!-- Pilot, sitzend im Gurtzeug, von der Seite -->
  <path d="M257 374 L251 397 L278 399 L281 419" fill="none" stroke="#F2557F"
        stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="355" r="10.5" fill="#F2557F"/>
</svg>
