  <!-- Logo „Wolkenatlas“ als Pixelbild (Nov. 2026, Wunsch des Besitzers).
       Die Idee: Der Gleitschirm ist eine Wolke. Die Wolke besteht aus weißen
       Pixeln mit unterschiedlicher Deckkraft, ihre Unterkante ist gewölbt wie
       die Kappe eines Schirms (an den Enden tiefer). Darunter hängt der Pilot:
       ein einziges pinkes Pixel. Hintergrund in der Tintenfarbe der Seite.
       Raster 21 mal 21, ein Pixel = 24 Punkte. Die Karte der Pixel
       (9 = ganz weiß, 4 = 40 Prozent Deckkraft, P = Pilot; leere Zeilen
       weggelassen, der Pilot hängt drei leere Zeilen unter der Wolke):
       .........4966........
       ........599894.56....
       ....564.899899698....
       ...499988999999995...
       ...699899999989999...
       ...789967999989779...
       ...57...........76...
       ..........P..........
       Aus dieser Datei sind alle Symbole in icons/ und apple-touch-icon.png
       gerechnet. Wer das Logo ändert, muss die PNG-Dateien neu erzeugen. -->
  <rect width="512" height="512" fill="#15202B"/>
  <g fill="#FFFFFF">
